<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cruzadinha de Arquitetura Computacional</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>Cruzadinha de Arquitetura Computacional</h1>

    <section class="board-section">
      <div id="board" class="board" aria-label="Tabuleiro da cruzadinha"></div>
    </section>

    <section class="clues-section">
      <div>
        <h2>Horizontais</h2>
        <ol id="across-clues"></ol>
      </div>
      <div>
        <h2>Verticais</h2>
        <ol id="down-clues"></ol>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
